<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{% block title %}App{% endblock %}</title>
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}">🌲 CampingCampagnes</h1>

        <a href="{{ url_for('index') }}">Accueil</a>
        <a href="{{ url_for('animations') }}">Animations</a>

        {% if not logged %}
            <a href="{{ url_for('inscription') }}">Inscription</a>
            <a href="{{ url_for('connexion') }}">Connexion</a>
        {% else %}
            <a href="{{ url_for('profil') }}">Profil</a>
            {% if is_animateur %}
                <a href="{{ url_for('planning') }}">Planning</a>
            {% else %}
                <a href="{{ url_for('agenda') }}">Agenda</a>
            {% endif %}
            <a href="{{ url_for('deconnexion') }}">Déconnexion</a>
        {% endif %}
    </header>

    {% block body %}
    {% endblock %}
</body>
</html>
